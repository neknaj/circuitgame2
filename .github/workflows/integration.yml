name: Cross-platform circuit traces

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  traces:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NCG2_CLI_PATH: ${{ github.workspace }}/cli
      NCG2_WEB_PATH: ${{ github.workspace }}/web
      NCG2_CORE_SHA: c6b9ea2fd3b73853067156358e1f420d7bbc671e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neknaj/circuitgame2-cli
          ref: 537c9367f0c0a18b51680ba9a90cc74729d4e0f0
          path: cli
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neknaj/circuitgame2-gui
          ref: 70dd1a438dab93214111cfe180b429283537ba7c
          path: web
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neknaj/circuitgame2-lib
          ref: 8d31e170f301a2e8900066eaea3dbf23643c8878
          path: examples/clocked-uart-transmitter/vendor/circuitgame2-lib
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.1
      - name: Build both CLI targets
        working-directory: cli
        run: |
          rustup target add wasm32-wasip2
          cargo tree --locked -d
          cargo build --locked --bin ncg2
          cargo build --locked --target wasm32-wasip2 --bin ncg2
      - name: Build the browser simulators
        working-directory: web
        run: |
          rustup target add wasm32-unknown-unknown
          cargo tree --locked -d
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          cargo build --locked --target wasm32-unknown-unknown
          cargo build --locked --target wasm32-unknown-unknown -p circuitgame2-gui --lib
          wasm-bindgen --target web --out-dir site/pkg target/wasm32-unknown-unknown/debug/circuitgame2_web.wasm
          wasm-bindgen --target web --out-dir crates/gui/web/pkg target/wasm32-unknown-unknown/debug/circuitgame2_gui.wasm
      - name: Install Wasmtime
        working-directory: ${{ runner.temp }}
        run: |
          archive=wasmtime-v44.0.1-x86_64-linux.tar.xz
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v44.0.1/$archive"
          echo "afd58715f105e3a7f454169daed22168c5736ec5f225fb04c4ac62c54c9508a3  $archive" | sha256sum --check
          tar xJf "$archive"
          echo "$RUNNER_TEMP/${archive%.tar.xz}" >> "$GITHUB_PATH"
      - name: Compare traces
        working-directory: tests/integration
        run: |
          example=../../examples/ncg2m-helpers
          library=../../examples/clocked-uart-transmitter/vendor/circuitgame2-lib
          path=src/ncg2m/bool/logic.ncg2m
          install -D "$library/$path" "$example/vendor/circuitgame2-lib/$path"
          npm ci --ignore-scripts
          npm exec -- playwright install --with-deps chromium
          npm test
